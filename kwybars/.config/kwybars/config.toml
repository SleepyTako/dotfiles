[overlay]
monitor_mode = "primary"
layer = "top"
frame_edges = ["left", "right"]
full_length = true
width = 150
height = 500
anchor_margin = 5
margin_left = 5
margin_right = 5

[visualizer]
layout = "frame"
frame_mirror_mode = "pairs"
bar_corner_radius = 0
bars = 100
bar_width = 10
segmented_bars = true
segment_length = 15
segment_gap = 3
gap = 10
framerate = 60
color_mode = "gradient"
color_rgba = "rgba(175, 198, 255, 0.7)"
color2_rgba = "rgba(191, 198, 220, 0.7)"
theme = "miku-synthwave"
theme_opacity = 0.9

# By default daemon is already enabled and configured for you. 
# Use in your config only if you need to customize.
[daemon]
enabled = true
poll_interval_ms = 90
activity_threshold = 0.035
activate_delay_ms = 180
deactivate_delay_ms = 2200
stop_on_silence = true
notify_on_error = true
notify_cooldown_seconds = 45
overlay_command = "kwybars-overlay"
overlay_args = []
